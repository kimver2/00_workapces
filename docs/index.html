<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우성아이디 현장 대시보드</title>
  
  <!-- 모바일 웹앱 / PWA 최적화 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="현장대시보드">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="우성아이디 현장 대시보드">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      border: none;
      display: block;
      background-color: #f8fafc;
    }
    /* 로딩 인디케이터 (앱 로드 전 자연스러운 스켈레톤/스피너) */
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: -0.3px;
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">우성아이디 대시보드 연결 중...</div>
  </div>

  <!-- 전체화면 무배너 웹앱 프레임 -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwJTNqEODEBUJNirHC3MWNpp-uSJsrjOPuT6C5cSJvlNCD1FIPOYZE9rn8aFhIouUY_/exec?v=196"
    allow="clipboard-write; camera; geolocation"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      var overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 400);
      }
    }
    // 최대 4초 후에는 로딩 화면 자동 해제
    setTimeout(hideLoading, 4000);
  </script>
</body>
</html>
