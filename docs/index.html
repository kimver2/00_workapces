<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우성아이디 현장 대시보드</title>
  
  <!-- 모바일 웹앱 / PWA 최적화 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="현장대시보드">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="우성아이디 현장 대시보드">
  <!-- 구글 서버 사전 연결 가속 (Preconnect & DNS-Prefetch) -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <!-- 캐시 방지 메타 태그 (모바일 웹앱 즉시 최신 반영 보장) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      border: none;
      display: block;
      background-color: #f8fafc;
    }
    /* 로딩 인디케이터 및 네이티브 앱 스켈레톤 UI (체감 0초 즉시 반응) */
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: opacity 0.16s ease-out, visibility 0.16s ease-out;
      overflow: hidden;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .skel-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .skel-brand {
      font-size: 14.5px;
      font-weight: 800;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .skel-sync-badge {
      font-size: 11px;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .skel-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .skel-kpi {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .skel-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skel-shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skelShimmer 1.2s infinite ease-in-out;
      border-radius: 6px;
    }
    @keyframes skelShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 네이티브 앱 스켈레톤 로딩 화면 -->
  <div id="loadingOverlay">
    <div class="skel-header">
      <div class="skel-brand"><span>📱</span> 우성아이디 현장관리</div>
      <div class="skel-sync-badge">
        <span class="spinner"></span>
        <span>연결 중</span>
      </div>
    </div>
    <div class="skel-body">
      <div class="skel-kpi">
        <div class="skel-shimmer" style="height: 36px;"></div>
        <div class="skel-shimmer" style="height: 36px;"></div>
        <div class="skel-shimmer" style="height: 36px;"></div>
      </div>
      <div class="skel-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="skel-shimmer" style="width: 55%; height: 16px;"></div>
          <div class="skel-shimmer" style="width: 18%; height: 14px; border-radius: 10px;"></div>
        </div>
        <div class="skel-shimmer" style="width: 100%; height: 4px; margin-top: 2px;"></div>
        <div class="skel-shimmer" style="width: 75%; height: 12px; margin-top: 4px;"></div>
      </div>
      <div class="skel-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="skel-shimmer" style="width: 65%; height: 16px;"></div>
          <div class="skel-shimmer" style="width: 18%; height: 14px; border-radius: 10px;"></div>
        </div>
        <div class="skel-shimmer" style="width: 100%; height: 4px; margin-top: 2px;"></div>
        <div class="skel-shimmer" style="width: 70%; height: 12px; margin-top: 4px;"></div>
      </div>
      <div class="skel-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="skel-shimmer" style="width: 50%; height: 16px;"></div>
          <div class="skel-shimmer" style="width: 18%; height: 14px; border-radius: 10px;"></div>
        </div>
        <div class="skel-shimmer" style="width: 100%; height: 4px; margin-top: 2px;"></div>
      </div>
    </div>
  </div>

  <!-- 최상위 퍼스트파티 구성원 인증 잠금창 (github.io 영구 localStorage & 365일 쿠키 직접 저장) -->
  <div id="topAccessLockOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0f172a;z-index:300000;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Pretendard',sans-serif;">
    <div style="background:#ffffff;border-radius:20px;width:100%;max-width:360px;padding:30px 24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.45);text-align:center;">
      <div style="width:54px;height:54px;border-radius:16px;background:#eff6ff;color:#2563eb;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px;box-shadow:0 4px 12px rgba(37,99,235,0.15);">🔒</div>
      <h2 style="margin:0 0 6px 0;font-size:19px;font-weight:900;color:#0f172a;letter-spacing:-0.4px;">우성아이디 구성원 인증</h2>
      <p style="margin:0 0 16px 0;font-size:12.5px;color:#64748b;line-height:1.5;">구성원 이름과 공용 비밀번호를 입력해 주세요.<br><span style="color:#2563eb;font-weight:700;">최초 1회 인증 시 이 기기에서 계속 유지됩니다.</span></p>
      <input type="text" id="topAccessNameInput" autocomplete="username" placeholder="구성원 이름 입력 (예: 홍길동)" onkeydown="if(event.key==='Enter'){var p=document.getElementById('topAccessPinInput');if(p)p.focus();}" style="width:100%;box-sizing:border-box;padding:12px 16px;margin-bottom:10px;border:2px solid #cbd5e1;border-radius:12px;font-size:16px;font-weight:800;text-align:center;outline:none;color:#0f172a;background:#f8fafc;transition:all 0.15s;" onfocus="this.style.borderColor='#2563eb';this.style.background='#ffffff';">
      <input type="password" id="topAccessPinInput" inputmode="text" autocomplete="current-password" placeholder="공용 비밀번호 입력" onkeydown="if(event.key==='Enter')submitTopAccessPin()" style="width:100%;box-sizing:border-box;padding:12px 16px;border:2px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:800;text-align:center;letter-spacing:4px;outline:none;color:#0f172a;background:#f8fafc;transition:all 0.15s;" onfocus="this.style.borderColor='#2563eb';this.style.background='#ffffff';">
      <div style="margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:3px;">
        <label style="display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:13px;font-weight:800;color:#1e293b;user-select:none;">
          <input type="checkbox" id="topAccessKeepChk" checked style="width:16px;height:16px;cursor:pointer;accent-color:#2563eb;margin:0;">
          <span>내 기기에서 자동 로그인 유지</span>
        </label>
        <span style="font-size:11px;color:#94a3b8;font-weight:600;">공용/외부 PC에서는 체크를 해제하세요 (창 닫으면 자동 잠금)</span>
      </div>
      <div id="topAccessPinError" style="display:none;margin-top:10px;font-size:12px;font-weight:700;color:#dc2626;">❌ 등록된 구성원 이름이 아니거나 비밀번호가 일치하지 않습니다.</div>
      <button type="button" id="topAccessPinBtn" onclick="submitTopAccessPin()" style="width:100%;margin-top:14px;padding:13px;background:#2563eb;color:#ffffff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.35);transition:background 0.15s;">인증하고 대시보드 열기</button>
    </div>
  </div>

  <!-- 전체화면 무배너 웹앱 프레임 (credentialless: 크롬 다중 구글 계정 로그인 시 쿠키 충돌 원천 차단) -->
  <iframe
    id="appFrame"
    credentialless
    src="https://script.google.com/macros/s/AKfycbwJTNqEODEBUJNirHC3MWNpp-uSJsrjOPuT6C5cSJvlNCD1FIPOYZE9rn8aFhIouUY_/exec?v=199"
    allow="clipboard-write; camera; geolocation"
    onload="hideLoading()">
  </iframe>

  <script>
    var GAS_AUTH_API_URL = 'https://script.google.com/macros/s/AKfycbwJTNqEODEBUJNirHC3MWNpp-uSJsrjOPuT6C5cSJvlNCD1FIPOYZE9rn8aFhIouUY_/exec';
    function getTopSavedCookie(name) {
      try {
        var match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : '';
      } catch (eC) { return ''; }
    }
    function setTopSavedCookie(name, val, maxAgeSec) {
      try {
        document.cookie = name + '=' + encodeURIComponent(val || '') + '; path=/; max-age=' + maxAgeSec + '; SameSite=Lax';
      } catch (eSC) {}
    }
    function getTopSavedAuth() {
      var tok = '';
      var usr = '';
      try {
        tok = localStorage.getItem('ws_dashboard_auth_token_v2') || sessionStorage.getItem('ws_dashboard_auth_token_v2') || getTopSavedCookie('ws_dashboard_auth_token_v2') || '';
        usr = localStorage.getItem('ws_dashboard_auth_user_v2') || getTopSavedCookie('ws_dashboard_auth_user_v2') || '';
      } catch (eG) {
        tok = getTopSavedCookie('ws_dashboard_auth_token_v2') || '';
        usr = getTopSavedCookie('ws_dashboard_auth_user_v2') || '';
      }
      return { token: tok, user: usr };
    }
    function saveTopAuthData(token, user, keepPersistent) {
      var cleanU = String(user || '').replace(/\s+/g, '').trim();
      if (keepPersistent !== false) {
        if (token) {
          try { localStorage.setItem('ws_dashboard_auth_token_v2', token); } catch (eL1) {}
          setTopSavedCookie('ws_dashboard_auth_token_v2', token, 31536000);
        }
        if (cleanU && cleanU.toLowerCase() !== 'admin') {
          try { localStorage.setItem('ws_dashboard_auth_user_v2', cleanU); } catch (eL2) {}
          setTopSavedCookie('ws_dashboard_auth_user_v2', cleanU, 31536000);
        }
      } else {
        try { localStorage.removeItem('ws_dashboard_auth_token_v2'); } catch (eLR) {}
        setTopSavedCookie('ws_dashboard_auth_token_v2', '', 0);
      }
      if (token) {
        try { sessionStorage.setItem('ws_dashboard_auth_token_v2', token); } catch (eSS) {}
      }
    }
    function checkTopPinLockout() {
      try {
        var lockUntil = parseInt(localStorage.getItem('ws_pin_lock_until_v1') || '0', 10) || 0;
        var nowMs = Date.now();
        var nInp = document.getElementById('topAccessNameInput');
        var pInp = document.getElementById('topAccessPinInput');
        var btn = document.getElementById('topAccessPinBtn');
        var errEl = document.getElementById('topAccessPinError');
        if (lockUntil > nowMs) {
          var remainSec = Math.ceil((lockUntil - nowMs) / 1000);
          var m = Math.floor(remainSec / 60);
          var s = remainSec % 60;
          var timeText = (m > 0 ? m + '분 ' : '') + s + '초';
          if (nInp) nInp.disabled = true;
          if (pInp) { pInp.disabled = true; pInp.value = ''; }
          if (btn) { btn.disabled = true; btn.style.background = '#94a3b8'; btn.innerText = '⛔ 입력 잠금 중 (' + timeText + ')'; }
          if (errEl) { errEl.style.display = 'block'; errEl.innerText = '⛔ 5회 연속 오류로 3분간 잠겼습니다. (' + timeText + ' 후 재시도)'; }
          setTimeout(checkTopPinLockout, 1000);
          return true;
        } else if (lockUntil > 0) {
          localStorage.removeItem('ws_pin_lock_until_v1');
          localStorage.removeItem('ws_pin_fail_count_v1');
          if (nInp) nInp.disabled = false;
          if (pInp) pInp.disabled = false;
          if (btn) { btn.disabled = false; btn.style.background = '#2563eb'; btn.innerText = '인증하고 대시보드 열기'; }
          if (errEl) errEl.style.display = 'none';
        }
      } catch (eLk) {}
      return false;
    }
    function submitTopAccessPin() {
      if (checkTopPinLockout()) return;
      var nInp = document.getElementById('topAccessNameInput');
      var pInp = document.getElementById('topAccessPinInput');
      var keepChk = document.getElementById('topAccessKeepChk');
      var errEl = document.getElementById('topAccessPinError');
      var btn = document.getElementById('topAccessPinBtn');
      var valName = nInp ? String(nInp.value || '').replace(/\s+/g, '').trim() : '';
      var valPin = pInp ? String(pInp.value || '').trim() : '';
      if (!valName) {
        if (errEl) { errEl.style.display = 'block'; errEl.innerText = '⚠️ 구성원 이름을 입력해 주세요.'; }
        if (nInp) nInp.focus();
        return;
      }
      if (!valPin) {
        if (errEl) { errEl.style.display = 'block'; errEl.innerText = '⚠️ 비밀번호를 입력해 주세요.'; }
        if (pInp) pInp.focus();
        return;
      }
      if (btn) { btn.disabled = true; btn.innerText = '구성원 및 비밀번호 확인 중...'; }
      fetch(GAS_AUTH_API_URL + '?action=verifyDashboardPin&user=' + encodeURIComponent(valName) + '&pin=' + encodeURIComponent(valPin), {
        method: 'GET',
        credentials: 'omit'
      })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (btn) { btn.disabled = false; btn.innerText = '인증하고 대시보드 열기'; }
          if (res && res.success && res.token) {
            try { localStorage.removeItem('ws_pin_fail_count_v1'); localStorage.removeItem('ws_pin_lock_until_v1'); } catch (eCl) {}
            var keep = keepChk ? !!keepChk.checked : true;
            saveTopAuthData(res.token, valName, keep);
            var topLock = document.getElementById('topAccessLockOverlay');
            if (topLock) topLock.style.display = 'none';
            if (orcaDashboardSource) {
              try { orcaDashboardSource.postMessage({ type: 'WS_RESTORE_AUTH', token: res.token, user: valName }, '*'); } catch (ePost) {}
            }
          } else {
            var failCnt = 1;
            try {
              failCnt = (parseInt(localStorage.getItem('ws_pin_fail_count_v1') || '0', 10) || 0) + 1;
              if (failCnt >= 5) {
                localStorage.setItem('ws_pin_lock_until_v1', String(Date.now() + 180000));
                localStorage.setItem('ws_pin_fail_count_v1', '0');
              } else {
                localStorage.setItem('ws_pin_fail_count_v1', String(failCnt));
              }
            } catch (eFc) {}
            if (checkTopPinLockout()) return;
            if (errEl) {
              errEl.style.display = 'block';
              errEl.innerText = '❌ ' + ((res && res.error) || '등록된 구성원 이름이 아니거나 비밀번호가 일치하지 않습니다.') + ' (오류 ' + failCnt + '/5회)';
            }
            if (pInp) { pInp.value = ''; pInp.focus(); }
          }
        })
        .catch(function() {
          if (btn) { btn.disabled = false; btn.innerText = '인증하고 대시보드 열기'; }
          if (errEl) { errEl.style.display = 'block'; errEl.innerText = '❌ 통신 오류가 발생했습니다. 다시 시도해 주세요.'; }
        });
    }
    (function() {
      try {
        var auth = getTopSavedAuth();
        var topLock = document.getElementById('topAccessLockOverlay');
        if (!auth.token) {
          if (topLock) topLock.style.display = 'flex';
          var nInp = document.getElementById('topAccessNameInput');
          if (nInp && auth.user && auth.user.toLowerCase() !== 'admin') nInp.value = auth.user;
          checkTopPinLockout();
        } else {
          if (topLock) topLock.style.display = 'none';
        }
        var frame = document.getElementById('appFrame');
        if (frame && (auth.token || auth.user)) {
          var baseSrc = frame.getAttribute('src') || '';
          var extra = '';
          if (auth.token) extra += '&authTok=' + encodeURIComponent(auth.token);
          if (auth.user) extra += '&authUsr=' + encodeURIComponent(auth.user);
          if (extra && baseSrc.indexOf('authTok=') === -1) {
            frame.src = baseSrc + extra;
          }
        }
      } catch (eInitFrame) {}
    })();

    function hideLoading() {
      var overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    }
    // 최대 2.2초 후에는 로딩 화면 자동 해제 (기존 4초 -> 2.2초 단축)
    setTimeout(hideLoading, 2200);

    // 모바일 기기 뒤로가기 버튼(popstate) 연동 브릿지:
    // 하단 상세 팝업이 열려 있을 때 기기 뒤로가기를 누르면 페이지 이탈 대신 팝업을 닫음
    var orcaDashboardSource = null;
    var orcaModalOpenInChild = false;
    var ignoreNextTopPopstate = false;

    window.addEventListener('message', function(ev) {
      var data = ev && ev.data;
      if (!data || typeof data !== 'object') return;
      if (ev.source) {
        orcaDashboardSource = ev.source;
      }
      if (data.type === 'DASHBOARD_READY') {
        hideLoading();
        try {
          var authRdy = getTopSavedAuth();
          if (ev.source && (authRdy.token || authRdy.user)) {
            ev.source.postMessage({ type: 'WS_RESTORE_AUTH', token: authRdy.token, user: authRdy.user }, '*');
          }
        } catch (eRdyAuth) {}
        return;
      }
      if (data.type === 'WS_AUTH_INIT') {
        try {
          var authInit = getTopSavedAuth();
          if (ev.source) ev.source.postMessage({ type: 'WS_RESTORE_AUTH', token: authInit.token, user: authInit.user }, '*');
        } catch (eAuthInit) {}
        return;
      }
      if (data.type === 'WS_SAVE_AUTH') {
        try {
          saveTopAuthData(data.token, data.user, data.keep);
          var topLock = document.getElementById('topAccessLockOverlay');
          if (topLock) topLock.style.display = 'none';
        } catch (eAuthSave) {}
        return;
      }
      if (data.type === 'ORCA_BRIDGE_PING') {
        try {
          if (ev.source) {
            ev.source.postMessage({ type: 'ORCA_BRIDGE_PONG' }, '*');
            var authPing = getTopSavedAuth();
            if (authPing.token || authPing.user) {
              ev.source.postMessage({ type: 'WS_RESTORE_AUTH', token: authPing.token, user: authPing.user }, '*');
            }
          }
        } catch (ePong) {}
      } else if (data.type === 'ORCA_SHEET_MODAL_OPEN') {
        if (!orcaModalOpenInChild) {
          orcaModalOpenInChild = true;
          try {
            if (window.history && typeof window.history.pushState === 'function') {
              window.history.pushState({ orcaSheetModal: true }, '');
            }
          } catch (ePush) {}
        }
      } else if (data.type === 'ORCA_SHEET_MODAL_CLOSED_BY_UI') {
        if (orcaModalOpenInChild) {
          orcaModalOpenInChild = false;
          try {
            if (window.history && typeof window.history.back === 'function') {
              ignoreNextTopPopstate = true;
              window.history.back();
            }
          } catch (eBack) {}
        }
      }
    });

    // 앱 초기 로드 시 메인 화면 진입 상태를 히스토리에 푸시하여
    // 뒤로가기 시 GAS iframe 리다이렉트 체인으로 역주행(무한 로딩바)하는 것을 원천 차단
    try {
      if (window.history && typeof window.history.pushState === 'function') {
        window.history.pushState({ page: 'home' }, '');
      }
    } catch (eInitPush) {}

    window.addEventListener('popstate', function() {
      if (ignoreNextTopPopstate) {
        ignoreNextTopPopstate = false;
        return;
      }
      if (orcaModalOpenInChild) {
        orcaModalOpenInChild = false;
        try {
          if (orcaDashboardSource) {
            orcaDashboardSource.postMessage({ type: 'ORCA_BACK_BUTTON' }, '*');
          }
        } catch (eNotify) {}
        return;
      }
      // 메인 화면 상태에서 뒤로가기 발생 시:
      // 브라우저가 iframe 리다이렉트 체인으로 빠져 로딩바가 무한 반복되는 현상을 원천 차단하고
      // 사용자에게 명확한 종료 확인 창 제공
      var doExit = confirm("우성아이디 대시보드를 종료하시겠습니까?");
      if (doExit) {
        window.close();
        setTimeout(function() {
          document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;">' +
            '<div style="font-size:48px;margin-bottom:16px;">👋</div>' +
            '<h2 style="color:#1e293b;margin-bottom:8px;font-size:18px;font-weight:800;">우성아이디 대시보드가 종료되었습니다</h2>' +
            '<p style="color:#64748b;font-size:14px;line-height:1.6;">브라우저 창(탭)을 닫아주세요.</p>' +
            '<button onclick="location.reload()" style="margin-top:20px;padding:10px 22px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;">다시 시작하기</button>' +
            '</div>';
        }, 150);
      } else {
        // 취소 시: 현재 메인화면 상태를 재등록하여 로딩바 루프 없이 화면 유지
        try {
          window.history.pushState({ page: 'home' }, '');
        } catch (eStay) {}
      }
    });

    // PC에서 부모 창 포커스 상태 시 Esc(Escape) 키 입력 브릿지:
    // iframe 내부 모달로 전달하여 팝업 닫기 지원
    window.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape' || ev.key === 'Esc' || ev.keyCode === 27) {
        if (orcaDashboardSource) {
          try {
            orcaDashboardSource.postMessage({ type: 'ORCA_ESCAPE_KEY' }, '*');
          } catch (eEsc) {}
        }
      }
    });
  </script>
</body>
</html>
