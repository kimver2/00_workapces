<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>우성아이디 현장 대시보드</title>
  
  <!-- 모바일 웹앱 / PWA 최적화 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="현장대시보드">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="우성아이디 현장 대시보드">
  <!-- 캐시 방지 메타 태그 (모바일 웹앱 즉시 최신 반영 보장) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      border: none;
      display: block;
      background-color: #f8fafc;
    }
    /* 로딩 인디케이터 (앱 로드 전 자연스러운 스켈레톤/스피너) */
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: -0.3px;
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">우성아이디 대시보드 연결 중...</div>
  </div>

  <!-- 전체화면 무배너 웹앱 프레임 -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxRcwYEilQ8wxRyMHxmPXUmLJjZ9qL2oclioJ7iQIYXdENmgjgWemu9D3T2m-FXHVvg/exec?v=162"
    allow="clipboard-write; camera; geolocation"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      var overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 400);
      }
    }
    // 최대 4초 후에는 로딩 화면 자동 해제
    setTimeout(hideLoading, 4000);

    // 모바일 기기 뒤로가기 버튼(popstate) 연동 브릿지:
    // 하단 상세 팝업이 열려 있을 때 기기 뒤로가기를 누르면 페이지 이탈 대신 팝업을 닫음
    var orcaDashboardSource = null;
    var orcaModalOpenInChild = false;
    var ignoreNextTopPopstate = false;

    window.addEventListener('message', function(ev) {
      var data = ev && ev.data;
      if (!data || typeof data !== 'object') return;
      if (ev.source) {
        orcaDashboardSource = ev.source;
      }
      if (data.type === 'ORCA_BRIDGE_PING') {
        try {
          if (ev.source) ev.source.postMessage({ type: 'ORCA_BRIDGE_PONG' }, '*');
        } catch (ePong) {}
      } else if (data.type === 'ORCA_SHEET_MODAL_OPEN') {
        if (!orcaModalOpenInChild) {
          orcaModalOpenInChild = true;
          try {
            if (window.history && typeof window.history.pushState === 'function') {
              window.history.pushState({ orcaSheetModal: true }, '');
            }
          } catch (ePush) {}
        }
      } else if (data.type === 'ORCA_SHEET_MODAL_CLOSED_BY_UI') {
        if (orcaModalOpenInChild) {
          orcaModalOpenInChild = false;
          try {
            if (window.history && typeof window.history.back === 'function') {
              ignoreNextTopPopstate = true;
              window.history.back();
            }
          } catch (eBack) {}
        }
      }
    });

    // 앱 초기 로드 시 메인 화면 진입 상태를 히스토리에 푸시하여
    // 뒤로가기 시 GAS iframe 리다이렉트 체인으로 역주행(무한 로딩바)하는 것을 원천 차단
    try {
      if (window.history && typeof window.history.pushState === 'function') {
        window.history.pushState({ page: 'home' }, '');
      }
    } catch (eInitPush) {}

    window.addEventListener('popstate', function() {
      if (ignoreNextTopPopstate) {
        ignoreNextTopPopstate = false;
        return;
      }
      if (orcaModalOpenInChild) {
        orcaModalOpenInChild = false;
        try {
          if (orcaDashboardSource) {
            orcaDashboardSource.postMessage({ type: 'ORCA_BACK_BUTTON' }, '*');
          }
        } catch (eNotify) {}
        return;
      }
      // 메인 화면 상태에서 뒤로가기 발생 시:
      // 브라우저가 iframe 리다이렉트 체인으로 빠져 로딩바가 무한 반복되는 현상을 원천 차단하고
      // 사용자에게 명확한 종료 확인 창 제공
      var doExit = confirm("우성아이디 대시보드를 종료하시겠습니까?");
      if (doExit) {
        window.close();
        setTimeout(function() {
          document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;">' +
            '<div style="font-size:48px;margin-bottom:16px;">👋</div>' +
            '<h2 style="color:#1e293b;margin-bottom:8px;font-size:18px;font-weight:800;">우성아이디 대시보드가 종료되었습니다</h2>' +
            '<p style="color:#64748b;font-size:14px;line-height:1.6;">브라우저 창(탭)을 닫아주세요.</p>' +
            '<button onclick="location.reload()" style="margin-top:20px;padding:10px 22px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;">다시 시작하기</button>' +
            '</div>';
        }, 150);
      } else {
        // 취소 시: 현재 메인화면 상태를 재등록하여 로딩바 루프 없이 화면 유지
        try {
          window.history.pushState({ page: 'home' }, '');
        } catch (eStay) {}
      }
    });

    // PC에서 부모 창 포커스 상태 시 Esc(Escape) 키 입력 브릿지:
    // iframe 내부 모달로 전달하여 팝업 닫기 지원
    window.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape' || ev.key === 'Esc' || ev.keyCode === 27) {
        if (orcaDashboardSource) {
          try {
            orcaDashboardSource.postMessage({ type: 'ORCA_ESCAPE_KEY' }, '*');
          } catch (eEsc) {}
        }
      }
    });
  </script>
</body>
</html>
